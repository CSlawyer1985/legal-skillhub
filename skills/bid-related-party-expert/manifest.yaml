name: bid-related-party-expert
version: 1.1.0
display_name: 投标企业关联关系识别专家（工商信息版）
description: 投标企业关联关系识别专家（基于公开工商信息版）。当用户需要识别多个投标主体之间是否存在法定禁止的关联投标——单位负责人为同一人、控股或直接管理关系（依据《招标投标法实施条例》第34条、《政府采购法实施条例》第18条），或需开展关联网络分析、否定性规则核查时触发。专注工商登记层面信息（法定代表人/负责人、股东及持股、股权穿透、董监高、注册/经营地址、联系电话/邮箱等），不分析投标行为痕迹与串标行为（第39/40条不在本技能范围）。可在争议点调用 IMA 知识库复核口径与类案。区别于 bid-compliance-due-diligence（查企业黑历史/行政处罚）、bid-dup-check（查标书文本雷同），本技能专注工商层面的关联认定与投标无效判定，仅输出评审参考、不替代法定认定。
author: "一线评标专家&ChesaraM"
emoji: 🔗
license: MIT-0
feedback:
