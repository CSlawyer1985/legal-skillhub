metadata:
  openclaw:
    homepage: https://github.com/chesaram/my-skill-hub
    triggers:
      - pattern: 关联关系识别
        description: 用户要识别多个投标主体之间是否存在法定禁止的关联关系
      - pattern: 投标企业关联
        description: 用户问几家公司投标是否构成关联、会不会导致投标无效
      - pattern: 关联投标核查
        description: 用户要求核对投标主体间的控股/管理/负责人同一关系
      - pattern: 单位负责人同一人
        description: 用户问不同单位负责人为同一人能否投同一标段
      - pattern: 股权穿透
        description: 用户要求穿透股权查最终受益人或实际控制人是否同一
      - pattern: 围标关联网络
        description: 用户怀疑多个投标主体存在关联网络（围标风险）
      - pattern: 关联企业投标无效
        description: 用户问哪些关联关系会导致投标无效
      - pattern: 投标主体关系核查
        description: 用户上传多家企业工商信息要求筛查关联信号
