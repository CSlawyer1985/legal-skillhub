# ============================================================
# 跨技能体系联动规则：patent-examination-guide ↔ ip-management-compliance
# ============================================================

cross-skill-linkage-rules:
  description: "审查指南实务技能与 ISO 56005 IP管理技能的跨体系联动规则"

  # ---- 联动定位 ----
  positioning:
    patent-examination-guide: "法律适用层 —— 回答「审查指南怎么规定、怎么判断」"
    ip-management-compliance: "体系管控层 —— 回答「如何系统化管理、如何合规运营」"

  # ---- 共享基础设施 ----
  shared-infrastructure:
    ima-knowledge-base: "中国大陆知识产权 (ima-mcp)"
    # ima-mcp: 已废弃（已迁移至 ima-mcp 直连）

  # ---- 联动规则 ----
  rules:

    # 规则CL-001：三性评估联动
    - rule-id: CL-001
      name: "三性评估全流程联动"
      trigger:
        source-skill: ip-mgmt-examination
        event: patentability-assessment-started
      action:
        target-skill: patent-exam-substantive
        type: cross-skill-invoke
        module: novelty-inventiveness-practicality
        data-flow: "审查指南三性判断标准 → ISO标准化评估流程"
      reverse:
        source-skill: patent-exam-substantive
        event: assessment-standard-needed
        target-skill: ip-mgmt-examination
        type: cross-skill-invoke
        module: iso-patentability-framework
        data-flow: "ISO评估框架 → 审查标准应用"
      priority: critical
      description: "三性评估时，审查指南提供具体判断标准，IP管理提供ISO标准化评估流程"

    # 规则CL-002：OA答复联动
    - rule-id: CL-002
      name: "OA答复全流程联动"
      trigger:
        source-skill: ip-mgmt-examination
        event: oa-response-needed
      action:
        target-skill: patent-exam-substantive
        type: cross-skill-invoke
        module: substantive-examination-procedure
        data-flow: "审查指南程序规定+三性标准 → OA答复策略"
      chain:
        - step: 1
          skill: patent-exam-substantive
          output: "审查意见类型+审查指南依据"
        - step: 2
          skill: ip-mgmt-examination
          output: "答复方案+争辩要点+修改建议"
        - step: 3
          skill: ip-mgmt-risk
          output: "驳回风险等级+备选方案"
      priority: critical
      description: "OA答复时，审查指南提供审查标准和程序规定，IP管理提供答复策略和风险评估"

    # 规则CL-003：无效应对联动
    - rule-id: CL-003
      name: "无效宣告应对联动"
      trigger:
        source-skill: ip-mgmt-risk
        event: invalidity-defense-needed
      action:
        target-skill: patent-exam-reexamination
        type: cross-skill-invoke
        module: invalidation-rules-evidence
        data-flow: "复审无效程序规则+证据规则 → 稳定性评估+应对策略"
      chain:
        - step: 1
          skill: patent-exam-reexamination
          output: "无效理由分析+程序规则+证据规则"
        - step: 2
          skill: ip-mgmt-risk
          output: "稳定性等级+证据组合+修改方案"
        - step: 3
          skill: ip-mgmt-audit
          output: "价值重评（是否值得抗辩）"
      priority: critical
      description: "无效应对时，审查指南提供程序和证据规则，IP管理提供稳定性评估和价值重评"

    # 规则CL-004：客体判断联动
    - rule-id: CL-004
      name: "保护客体判断联动"
      trigger:
        source-skill: ip-mgmt-examination
        event: subject-matter-assessment-needed
      action:
        target-skill: patent-exam-preliminary
        type: cross-skill-invoke
        module: preliminary-examination-standards
        data-flow: "初审客体标准 → 合规检查清单"
      priority: high
      description: "保护客体判断时，审查指南提供初审标准，IP管理提供合规检查流程"

    # 规则CL-005：国际布局联动
    - rule-id: CL-005
      name: "国际专利布局联动"
      trigger:
        source-skill: ip-mgmt-innovation
        event: international-filing-strategy-needed
      action:
        target-skill: patent-exam-pct-national
        type: cross-skill-invoke
        module: pct-national-phase-procedures
      alternative-target:
        target-skill: patent-exam-design-intl
        condition: "design-patent == true"
        module: hague-agreement-procedures
      priority: high
      description: "国际布局时，审查指南提供PCT/海牙程序规定，IP管理提供布局决策框架"

    # 规则CL-006：FTO审查标准联动
    - rule-id: CL-006
      name: "FTO分析审查标准联动"
      trigger:
        source-skill: ip-mgmt-risk
        event: fto-examination-standard-needed
      action:
        target-skill: patent-exam-substantive
        type: cross-skill-invoke
        module: claim-interpretation-equivalents
        data-flow: "权利要求解释+等同判断标准 → FTO分析"
      priority: high
      description: "FTO分析时，审查指南提供权利要求解释和等同判断标准"

    # 规则CL-007：AI专利审查联动
    - rule-id: CL-007
      name: "AI专利可专利性联动"
      trigger:
        source-skill: ip-mgmt-innovation
        event: ai-patent-assessment-needed
      action:
        target-skill: patent-exam-substantive
        type: cross-skill-invoke
        module: chapter9-ai-bigdata-provisions
        data-flow: "第九章AI审查规定（含2026修改19示例） → 创新决策"
      priority: high
      description: "AI专利评估时，审查指南提供第九章专门规定，IP管理提供创新决策建议"

    # 规则CL-008：价值评估联动
    - rule-id: CL-008
      name: "专利价值评估审查依据联动"
      trigger:
        source-skill: ip-mgmt-audit
        event: valuation-examination-basis-needed
      action:
        target-skill: patent-exam-reexamination
        type: cross-skill-invoke
        module: invalidity-stability-rules
        data-flow: "无效规则+稳定性因素 → 可维权性评价维度"
      priority: medium
      description: "价值评估时，审查指南提供无效规则和稳定性因素作为可维权性评价依据"

  # ---- 联动优先级 ----
  priority-config:
    P0_critical:
      - CL-001  # 三性评估
      - CL-002  # OA答复
      - CL-003  # 无效应对
    P1_high:
      - CL-004  # 客体判断
      - CL-005  # 国际布局
      - CL-006  # FTO审查标准
      - CL-007  # AI专利
    P2_medium:
      - CL-008  # 价值评估

