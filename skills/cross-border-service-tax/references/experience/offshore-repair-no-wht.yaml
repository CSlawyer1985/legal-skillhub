entries:
- id: offshore-repair-no-wht
  scenario_key: offshore-repair-no-wht
  status: provisional
  confidence: medium
  conclusion: 维修/劳务完全发生在境外的,按劳务发生地原则不属于来源于境内所得,无须代扣企业所得税;增值税亦不代扣(不在境内销售)
  detail: '关键规则:《企业所得税法实施条例》第7条第2项"提供劳务所得,按照劳务发生地确定来源地"。

    维修完全发生在境外 → 不属于来源于境内所得 → 无须代扣企税。

    增值税侧:维修完全在境外发生 → 不属于在境内销售 → 不代扣增值税。

    指引曾缺"劳务发生地"规则(V3),本经验提示办案时须主动适用该条。

    降级备注(2026-08-12 crit 复查):原 confidence=high 仅满足"≥2 来源"表面门槛。crit 实测发现 sources 实质独立度不足——两条都是原则性条款,缺少具体案例/口径证据佐证边角情形适用。降至
    medium,需补强独立来源后再升级。

    '
