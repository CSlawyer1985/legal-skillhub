entries:
- id: transfer-pricing-7-patterns
  scenario_key: transfer-pricing
  status: provisional
  confidence: medium
  conclusion: 转让定价7种形态识别清单(职能定位失衡/采购型/优惠到期即亏损/服务费型/无形资产型/管理费型/海外特别调整),按形态选调整方法
  detail: '7形态速查(详见 references/风险与合规要点.md 2.1节):

    1. 职能定位失衡(销售型):签约方高利润 vs 实际创造方低利润 → TNMM/利润分割

    2. 采购型(高买):关联采购价高于独立交易价 → CUP

    3. 优惠到期即亏损:两免三减半结束立即亏损+出口毛利率低于内销+关联客户 → TNMM(历史可比)

    4. 服务费型(超额):服务费超同业(如3倍) → CUP/TNMM

    5. 无形资产型(低价):许可费率<可比中位数50% → CUP(可比费率)

    6. 管理费型(虚假):声称管理指导但未提供;股东活动不应收费 → 实质审查→不扣除

    7. 海外特别调整:走出去企业境外子公司被东道国调查 → 东道国规则/MAP

    审查顺序:先识别形态 → 选方法 → 核同期资料门槛(本地文档/主体文档/国别报告)。

    '
  sources:
  - 企业所得税法第41条(独立交易原则)
  - 国家税务总局公告2016年第42号(同期资料门槛)
  - 国家税务总局公告2016年第64号(特别纳税调查调整)
