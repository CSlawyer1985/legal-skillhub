entries:
- id: indirect-transfer-recharacterization
  scenario_key: indirect-transfer-recharacterization
  status: provisional
  confidence: high
  conclusion: 间接转让境外控股公司股权(含吸收合并形式),若中间公司无实质经营+主要价值在境内+无合理商业目的,依47条/7号公告穿透重新定性为境内所得,按10%源泉扣缴(非25%)
  detail: '7号公告穿透7要素(合理商业目的测试):股权价值主要来源、资产构成、存续时间、经济实质、所得性质、境外税负、交易后实质经营活动。

    形式多样:直接转让境外控股公司股权(CC10 TCI最高法公报案)、境外吸收合并全资子公司导致中国股权被转让(CC15意迩瓦案)。

    关键税率口径:非居民源泉扣缴10%(实施条例第91条),非居民企业25%。CC15复算确认补税额=计税基础×10%精确到分。

    '
  sources:
  - 企业所得税法第47条(一般反避税)
  - 国家税务总局公告2015年第7号(间接转让)
  - 最高人民法院(2016)最高法行申1867号(TCI案)
  - (2015)芝行初字第16号(意迩瓦案)
  captured_at: 2026-08-11
  ref_count: 1
  search_queries:
  - 间接转让 重新定性 7号公告
  - 吸收合并 间接转让 中国股权
  - 穿透 合理商业目的
