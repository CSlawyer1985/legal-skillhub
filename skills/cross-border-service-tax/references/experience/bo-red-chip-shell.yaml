entries:
- id: bo-red-chip-shell-denied
  scenario_key: bo-red-chip-shell
  status: provisional
  confidence: high
  conclusion: 红筹架构香港中间控股公司,9号公告不利因素全命中(无场地/无员工/无实质业务/资金收到即转出/不担风险)即否定受益所有人,股息5%→10%并追溯补缴
  detail: '实质审查6维度:人员(有与功能匹配的员工)、资产(固定资产/无形资产与经营匹配)、决策(独立投融资/经营决策)、风险(承担经营/投资风险)、业务(实质性经营活动)、资金(所得用于自身经营而非收到即转付)。

    多层架构:任一层控股股东不具实质的,可能影响认定(CC23山东省高院2024-10终审确立)。

    举证责任在纳税人(35号公告),拒绝提供资料=不享优惠。

    ⚠️ 9号公告第三/四条(穿透/安全港)确切条款号待核实。

    '
  sources:
  - 国家税务总局公告2018年第9号(受益所有人)
  - 内地与香港税收安排第10条(股息)
  - CC23山东省高院(2024-10)终审判决
  - 国家税务总局公告2019年第35号(自行判断+留存备查)
  captured_at: 2026-08-11
  ref_count: 1
  search_queries:
  - 受益所有人 9号公告 不利因素
  - 红筹架构 香港导管公司 股息
  - 多层控股 穿透 受益所有人
