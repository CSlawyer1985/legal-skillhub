<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>律师工作台</title>
<!-- 本页为骨架模板：单文件、全内联、零外链。改造时只动 <body> 里的结构和 render* 函数。 -->
<style>
:root{
  --line:#E3E8EF; --line2:#EDF1F6; --text:#1F2937; --muted:#6B7280; --faint:#9CA3AF;
  --brand:#185FA5; --brandsoft:#E6F1FB; --brandline:#B5D4F4;
  --danger:#A32D2D; --dangersoft:#FCEBEB; --warn:#854F0B; --warnsoft:#FAEEDA;
  --ok:#3B6D11; --oksoft:#EAF3DE;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:#F7F9FC;display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------- 顶栏 ---------- */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:9px 16px;background:#fff;
     border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:15px;font-weight:600}
.brand .meta{font-size:11.5px;color:var(--faint)}
.quick{flex:1;display:flex;align-items:center;gap:6px;max-width:640px}
.quick input,.quick select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;background:#fff}
.quick .w-d{width:132px}.quick .w-p{width:150px}.quick .w-t{width:96px}.quick .w-x{flex:1;min-width:120px}
.quick input:focus,.quick select:focus{outline:2px solid var(--brandline);border-color:var(--brand)}
.topAct{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--text)}
.btn:hover{background:#F5F8FB}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:#1D9E75}.dot.bad{background:var(--danger)}

/* ---------- 三栏 ---------- */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(320px,1fr) 330px;
      gap:11px;padding:11px 16px 14px}
.col{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;
     flex-direction:column;min-height:0;overflow:hidden}
.colH{flex:none;display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line2);
      font-size:12.5px;font-weight:600;color:var(--muted)}
.colB{flex:1;min-height:0;overflow:auto;padding:7px}

/* ---------- 左栏：案件/项目 ---------- */
.pitem{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:7px;cursor:pointer;
       border:1px solid transparent}
.pitem:hover{background:#F5F8FB}
.pitem.sel{background:var(--brandsoft);border-color:var(--brandline)}
.ptop{display:flex;align-items:center;gap:6px}
.pitem .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.pitem.sel .pn{color:var(--brand);font-weight:600}
.pchip{font-size:10.5px;line-height:16px;padding:0 5px;border-radius:3px;background:#EEF1F5;color:var(--muted)}
.pchip.red{background:var(--dangersoft);color:var(--danger);font-weight:600}

/* ---------- 中栏：月历 ---------- */
.calH{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line2)}
.calH .m{font-size:13px;font-weight:600}
.calH .nav{margin-left:auto;display:flex;gap:5px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:7px 7px 0}
.wd div{text-align:center;font-size:11px;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px 7px 7px;flex:1;min-height:0}
.cell{border:1px solid var(--line2);border-radius:6px;padding:3px 4px;overflow:hidden;cursor:pointer;
      background:#fff;display:flex;flex-direction:column;gap:2px;min-height:0}
.cell:hover{border-color:var(--brandline)}
.cell.out{background:#FAFBFD}
.cell.out .cd{color:#C4CBD6}
.cell.today{border-color:var(--brand);background:var(--brandsoft)}
.cell.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cell .cd{font-size:11px;color:var(--muted);flex:none}
.cell .ev{font-size:10.5px;line-height:1.35;padding:1px 3px;border-radius:3px;background:#F1F5F9;
          color:#3C4858;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .ev.dim{opacity:.32}
.cell .more{font-size:10px;color:var(--faint)}
.calFoot{flex:none;padding:7px 11px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--faint)}
.calFoot b{color:var(--muted)}

/* ---------- 右栏 ---------- */
.grp{font-size:11.5px;font-weight:600;color:var(--muted);padding:9px 6px 4px}
.row{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:7px;border-left:3px solid transparent}
.row:hover{background:#F8FAFC}
.row.over{border-left-color:var(--danger);background:var(--dangersoft)}
.row .t{flex:1;min-width:0;font-size:12.5px;word-break:break-word}
.row .d{font-size:11px;color:var(--faint);flex:none}
.row .acts{display:flex;gap:3px;flex:none}
.row .acts button{opacity:.35;border:0;background:transparent;padding:2px;border-radius:4px;color:var(--muted);
                  display:inline-flex}
.row:hover .acts button{opacity:1}
.row .acts button:hover{background:#E1E8F1;color:var(--text)}
.row.done .t{text-decoration:line-through;color:var(--faint)}
.ico{width:13px;height:13px;display:block}
.empty{color:var(--faint);font-size:12px;padding:8px 6px}
.span8{font-size:11.5px;color:var(--faint);padding:7px 6px}
.err{margin:7px;padding:7px 9px;border-radius:7px;background:var(--warnsoft);color:var(--warn);font-size:12px}

/* ---------- 提示条 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
       background:#1F2937;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;
       opacity:0;pointer-events:none;transition:.18s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  body{overflow:auto}
  .cols{grid-template-columns:1fr;height:auto}
  .col{max-height:none}
  .quick{flex-wrap:wrap;max-width:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>律师工作台</h1>
    <span class="meta" id="srcMeta"></span>
  </div>
  <div class="quick">
    <input type="date" id="qDate" class="w-d" aria-label="日期">
    <input type="text" id="qProject" class="w-p" list="projList" placeholder="归属（可留空）" aria-label="归属">
    <datalist id="projList"></datalist>
    <select id="qType" class="w-t" aria-label="类型"
            title="进展：记已经做完的事，只是留痕。&#10;提醒：记还没做的事，有日期，到期会标红。">
      <option value="进展">进展 · 记已做</option>
      <option value="提醒">提醒 · 要办</option>
    </select>
    <input type="text" id="qText" class="w-x" placeholder="记一条…（回车即存到本地 动态.csv）" aria-label="内容">
    <button class="btn primary" id="qSave">记下</button>
  </div>
  <div class="topAct">
    <span class="dot" id="dot" title="本地服务状态"></span>
    <button class="btn sm" id="btnClear" title="删掉首次运行时的示例条目">清空示例</button>
  </div>
</header>

<main class="cols">

  <aside class="col">
    <div class="colH">案件 / 项目 <span class="pchip" id="projCount"></span></div>
    <div class="colB" id="projBox"></div>
  </aside>

  <section class="col">
    <div class="calH">
      <span class="m" id="calMonth"></span>
      <span class="nav">
        <button class="btn sm" id="mPrev">‹</button>
        <button class="btn sm" id="mToday">今天</button>
        <button class="btn sm" id="mNext">›</button>
      </span>
    </div>
    <div class="wd">
      <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="calFoot" id="calFoot"></div>
  </section>

  <aside class="col">
    <div class="colH" id="dayTitle">今天</div>
    <div class="colB" id="rightBox"></div>
  </aside>

</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

var S = { state:null, month:"", sel:"", project:"" };
var ICON = {
  check:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 6.5 12 13 4.5"/></svg>',
  del:'<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10M6.5 5V3.5h3V5M4.5 5l.6 8h5.8l.6-8"/></svg>'
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function mmdd(iso){ return iso && iso.length >= 10 ? iso.slice(5) : (iso || ""); }
function wdOf(iso){ try{ return "一二三四五六日"[new Date(iso + "T00:00:00").getDay() === 0 ? 6 : new Date(iso + "T00:00:00").getDay() - 1]; }catch(e){ return ""; } }
function addMonth(ym, n){
  var y = +ym.slice(0,4), m = +ym.slice(5,7) + n;
  while (m > 12){ m -= 12; y++; } while (m < 1){ m += 12; y--; }
  return y + "-" + (m < 10 ? "0" + m : m);
}

function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

/* ---------------- 与本地服务通信 ---------------- */
function api(path, body){
  var opt = body ? { method:"POST", headers:{ "Content-Type":"application/json" },
                     body:JSON.stringify(body) } : undefined;
  return fetch(path, opt).then(function(r){ return r.json(); });
}

function loadState(){
  var q = "/api/state?month=" + encodeURIComponent(S.month) +
          "&project=" + encodeURIComponent(S.project);
  return api(q).then(function(st){
    S.state = st;
    if (st.month) S.month = st.month;
    if (!S.sel) S.sel = st.today;
    $("dot").className = "dot ok";
  }).catch(function(){
    S.state = null; $("dot").className = "dot bad";
  });
}

/* ---------------- 渲染（彼此不互相调用，由 refreshAll 统一调度） ---------------- */

function renderTop(){
  var st = S.state;
  if (!st){
    $("srcMeta").textContent = "本地服务未连接 —— 确认启动脚本的窗口还开着";
    return;
  }
  $("srcMeta").textContent = "正本 " + (st.source.xlsx.split("/").pop() || st.source.xlsx) +
    (st.source.mtime ? " · " + st.source.mtime.slice(11) : "");
  $("srcMeta").title = st.source.xlsx + (st.calendarError ? "\n" + st.calendarError : "");
  $("srcMeta").style.color = st.calendarError ? "var(--warn)" : "";
  $("projList").innerHTML = (st.projects || []).map(function(p){
    return '<option value="' + esc(p.name) + '">'; }).join("");
}

function renderProjects(){
  var st = S.state, box = $("projBox");
  if (!st){ box.innerHTML = ""; return; }
  $("projCount").textContent = st.projects.length + " 个";
  var html = '<div class="pitem' + (S.project ? "" : " sel") + '" data-proj="" title="取消筛选">' +
    '<div class="ptop"><span class="pn">全部</span>' +
    '<span class="pchip">' + st.totals.dyn + '</span>' +
    (st.totals.open ? '<span class="pchip red">' + st.totals.open + '</span>' : "") +
    '</div></div>';
  html += st.projects.map(function(p){
    return '<div class="pitem' + (S.project === p.name ? " sel" : "") + '" data-proj="' + esc(p.name) + '">' +
      '<div class="ptop"><span class="pn">' + esc(p.name) + '</span>' +
      (p.open ? '<span class="pchip red">' + p.open + '</span>' : "") +
      '<span class="pchip">' + p.n + '</span></div></div>';
  }).join("");
  box.innerHTML = html || '<p class="empty">还没有条目。在上面「记一条」写点什么试试。</p>';
}

function renderCalendar(){
  var st = S.state;
  if (!st){ $("calGrid").innerHTML = ""; $("calMonth").textContent = ""; return; }
  $("calMonth").textContent = st.month.replace("-", " 年 ") + " 月";
  var total = 0, days = 0;
  $("calGrid").innerHTML = st.weeks.map(function(row){
    return row.map(function(d){
      var cls = "cell" + (d.inMonth ? "" : " out") + (d.isToday ? " today" : "") +
                (S.sel === d.date ? " sel" : "");
      var evs = d.items.slice(0, 3).map(function(it){
        return '<div class="ev' + (it.hit ? "" : " dim") + '" title="' + esc(it.text) + '">' +
          esc(it.text) + '</div>';
      }).join("");
      var more = d.items.length > 3 ? '<div class="more">+' + (d.items.length - 3) + '</div>' : "";
      if (d.inMonth){ total += d.items.length; if (d.items.length) days++; }
      return '<div class="' + cls + '" data-date="' + d.date + '">' +
        '<div class="cd">' + d.day + (d.isToday ? " 今天" : "") + '</div>' + evs + more + '</div>';
    }).join("");
  }).join("");
  $("calFoot").innerHTML = "本月 <b>" + total + "</b> 条排期 · <b>" + days + "</b> 天有安排 · 点日期看当天" +
    (S.project ? ' · 已聚焦 <b>' + esc(S.project) + '</b>' : "");
}

function renderRight(){
  var st = S.state, box = $("rightBox");
  if (!st){ box.innerHTML = '<p class="empty">连不上本地服务。</p>'; return; }

  /* 右栏标题跟着选中日期走 */
  var isToday = S.sel === st.today;
  $("dayTitle").textContent = (isToday ? "今天 " : "") + mmdd(S.sel) + " 周" + wdOf(S.sel);

  var html = "";

  /* —— 逾期未办结（红） —— */
  if (st.alerts.length){
    html += '<div class="grp">逾期未办结</div>';
    html += st.alerts.map(function(r){
      return '<div class="row over"><span class="t">' + esc(r.text) +
        '<br><span class="d">' + esc(r.project || "未归类") + ' · 逾期 ' + r.overdue + ' 天</span></span>' +
        '<span class="acts"><button data-act="finish" data-id="' + esc(r.id) + '" title="办结">' +
        ICON.check + '</button></span></div>';
    }).join("");
  }

  /* —— 今天到期 —— */
  if (st.dueToday.length){
    html += '<div class="grp">今天到期</div>';
    html += st.dueToday.map(function(r){
      return '<div class="row"><span class="t">' + esc(r.text) + '</span>' +
        '<span class="acts"><button data-act="finish" data-id="' + esc(r.id) + '" title="办结">' +
        ICON.check + '</button></span></div>';
    }).join("");
  }

  /* —— 选中那天的排期（从月历里取，不再请求） —— */
  var items = [];
  (st.weeks || []).forEach(function(row){
    row.forEach(function(d){ if (d.date === S.sel) items = d.items; });
  });
  html += '<div class="grp">' + mmdd(S.sel) + ' 的安排</div>';
  html += items.length
    ? items.map(function(it){
        return '<div class="row"' + (it.hit || !S.project ? "" : ' style="opacity:.4"') + '>' +
          '<span class="t">' + esc(it.text) + '</span>' +
          '<span class="d">' + esc(it.sheet || "") + '</span></div>';
      }).join("")
    : '<p class="empty">这天没有排期。</p>';

  /* —— 动态流 —— */
  html += '<div class="grp">动态</div>';
  html += st.dynamic.length
    ? st.dynamic.map(function(r){
        var cls = "row" + (r.status === "已办" ? " done" : "");
        return '<div class="' + cls + '"><span class="d">' + mmdd(r.date) + '</span>' +
          '<span class="t">' + esc(r.text) +
          (r.project ? '<br><span class="d">' + esc(r.project) + ' · ' + esc(r.type) + '</span>' : "") +
          '</span><span class="acts">' +
          (r.status !== "已办" ? '<button data-act="finish" data-id="' + esc(r.id) + '" title="办结">' + ICON.check + '</button>' : "") +
          '<button data-act="del" data-id="' + esc(r.id) + '" title="删除">' + ICON.del + '</button>' +
          '</span></div>';
      }).join("")
    : '<p class="empty">还没有动态。</p>';

  box.innerHTML = html;
}

function refreshAll(){
  renderTop();
  renderProjects();
  renderCalendar();
  renderRight();
}

/* ---------------- 交互 ---------------- */

function submitQuick(){
  var t = $("qText").value.trim();
  if (!t){ toast("先写点什么"); return; }
  api("/api/dynamic", { op:"add", item:{
    date: $("qDate").value || (S.state ? S.state.today : ""),
    project: $("qProject").value.trim(),
    type: $("qType").value,
    text: t
  }}).then(function(){
    $("qText").value = "";
    return loadState();
  }).then(refreshAll).then(function(){ toast("已记下"); });
}

$("qSave").addEventListener("click", submitQuick);
$("qText").addEventListener("keydown", function(e){ if (e.key === "Enter") submitQuick(); });

$("projBox").addEventListener("click", function(e){
  var it = e.target.closest("[data-proj]");
  if (!it) return;
  S.project = it.dataset.proj || "";
  loadState().then(refreshAll);
});

$("calGrid").addEventListener("click", function(e){
  var c = e.target.closest("[data-date]");
  if (!c) return;
  S.sel = c.dataset.date;
  refreshAll();
});

$("rightBox").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.dataset.act;
  if (act === "del"){
    if (!confirm("删除这条？")) return;
    api("/api/dynamic", { op:"delete", item:{ id:b.dataset.id } }).then(loadState).then(refreshAll);
  } else if (act === "finish"){
    api("/api/dynamic", { op:"finish", item:{ id:b.dataset.id } }).then(loadState).then(refreshAll);
  }
});

$("mPrev").addEventListener("click", function(){ S.month = addMonth(S.month, -1); loadState().then(refreshAll); });
$("mNext").addEventListener("click", function(){ S.month = addMonth(S.month,  1); loadState().then(refreshAll); });
$("mToday").addEventListener("click", function(){
  S.month = S.state ? S.state.today.slice(0, 7) : S.month;
  S.sel = S.state ? S.state.today : S.sel;
  loadState().then(refreshAll);
});
$("btnClear").addEventListener("click", function(){
  if (!confirm("删掉所有带「示例数据」字样的条目？（你自己的记录不受影响）")) return;
  api("/api/dynamic", { op:"clear_demo", item:{} }).then(loadState).then(refreshAll)
    .then(function(){ toast("示例已清空"); });
});

/* ---------------- 初始化 ---------------- */
document.addEventListener("DOMContentLoaded", function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get("project")) S.project = q.get("project");
    if (q.get("month") && /^\d{4}-\d{2}$/.test(q.get("month"))) S.month = q.get("month");
    if (q.get("sel") && /^\d{4}-\d{2}-\d{2}$/.test(q.get("sel"))) S.sel = q.get("sel");
  } catch (e) {}
  loadState().then(function(){
    if (S.state){
      if (!S.sel) S.sel = S.state.today;
      if (!S.month) S.month = S.state.today.slice(0, 7);
      $("qDate").value = S.state.today;
    }
    refreshAll();
  });
  setInterval(function(){ loadState().then(refreshAll); }, 120000);
});
</script>
</body>
</html>
