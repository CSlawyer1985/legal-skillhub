name: 投标文件合规检查助手
slug: bidding-compliance-advisor
emoji: "📋"
version: 1.3.1
author: 一线评标专家&ChesaraM
license: MIT-0
feedback:
  channel: "微信公众号"
  account: "一线评标专家"
  note: "使用问题、误报反馈、实务建议，欢迎关注公众号「一线评标专家」留言交流"
description: 投标人侧「投标文件合规检查」独立技能：对照招标文件系统检查投标文件的格式、资质、签字盖章、密封、份数、实质性响应等完整性，输出可打印打勾的四级结构化清单（🔴废标/🟡资质/🟢格式/⏰时间）与倒计时冲刺流程，提前发现废标风险；含输入预检硬门禁、必查盲区强制校验、判定标尺、多轮状态管理、内置法条/案例库离线兜底；新增硬性输出契约（状态赋值+输出自检）。支撑招标文件合法性审查、法条问答、违规识别、异议投诉辅助。不适用于政府采购货物服务（财政部87号令体系）。
changelog:
  - version: 1.3.1
    date: 2026-07-23
    change: 审核合规修复——移除 README.md 中 SkillHub 判定的"引导关注特定微信公众号"导流内容（保留署名与许可）；反馈渠道保留在 `manifest.yaml` 自定义 `feedback` 元数据，并通过 SKILL.md「生成内容署名与反馈脚注」指令在模型输出中自然呈现，符合平台展示内容合规要求。
  - version: 1.3.0
    date: 2026-07-23
    change: 提示词工程优化——消除标尺/Few-Shot/核心法条在 SKILL.md 内联与 references/ 的多份拷贝（SKILL.md 仅留速览+索引）；合并 §4 输出骨架为硬性"输出契约"（固定段序+状态赋值规则✅/⚠️/⬜禁止臆造+占位符禁残留+输出自检§4.5）；§2.1 预检改为硬门禁（缺关键项且未显式降级则 STOP）；盲区警告锚定为头部红字块。统一 slug 为 bidding-compliance-advisor；修复设计说明文件名乱码（→DESIGN_NOTES.md）；FAQ/最佳实践/常见误用外移至 references/faq.md。体积约 31KB→13KB。
  - version: 1.2.0
    date: 2026-07-19
    change: 对标 4.8 分 carrot-pit 结构升级——新增 references/compliance-signals.md 判定标尺（四级精确标准+误判边界+必查盲区）、references/few_shot.md 边界校准；SKILL.md 重组为 §0~§7（输入预检+必查盲区校验+标尺入口+内联兜底+护栏铁律+部署/Welcome+Few-Shot）；templates/checklist-template.md 输出模板（>15项折叠+📌回显+盲区警告）；test_cases/cases.md 10 回归用例；README/设计说明/manifest 文档三件套；合规声明升级为护栏铁律（法条模糊化/现行有效性/分级不越权/政采硬隔离）。
  - version: 1.1.0
    date: 2026-07-19
    change: 吸收评分反馈——新增内置法条/案例库（references/legal_core.md，离线兜底）、多轮对话状态管理（项目档案卡+回显防漂移）、快速开始三步上手。
  - version: 1.0.0
    date: 2026-07-18
    change: 首版单文件 SKILL.md——四级检查清单+倒计时冲刺+错误处理+FAQ+最佳实践+扩展功能（法律审查/问答/违规识别/异议投诉）。
