description: 供应商侧「政府采购响应文件合规检查」独立技能：对照政府采购采购文件（竞争性谈判/竞争性磋商/询价/单一来源为主的响应文件，亦兼容政采公开招标文件）系统检查响应文件的格式、资质、政策功能、签字盖章、密封、份数、实质性响应等完整性，输出可打印打勾的四级结构化清单（🔴无效响应/废标·🟡资质政策功能/🟢格式/⏰时间）与倒计时冲刺流程，提前发现无效响应风险；重点覆盖中小企业声明函真实性、信用中国查询、节能/环标强制品目、进口产品核准、专门面向资格等政采特有盲区；含输入预检硬门禁、必查盲区强制校验、判定标尺、多轮状态管理、内置法条/案例库离线兜底。不适用于依法必须招标的工程建设项目（《招标投标法》体系）。
changelog:
  - version: 1.0.1
    date: 2026-07-23
    change: 挂载 IMA 知识库作为运行时核实层：政府采购实务与合规（kb_id 7463496212028405）、政府采购投诉AI知识库（kb_id 7450416392468005）、招标文件/采购文件汇集（kb_id 7439473860155957，混合内容需按政采语境过滤）。同步更新 SKILL.md「知识库来源」与 references/legal_core.md 说明；明确招投标体系 KB 不挂载，避免跨体系误用。
  - version: 1.0.0
    date: 2026-07-23
    change: 基于「投标文件合规检查助手 bidding-compliance-advisor 1.3.1」结构改写，体系由《招标投标法》切换为《政府采购法》。核心差异：采购文件/响应文件（非招标文件/投标文件）、无效响应/废标（非废标）、质疑 7 工作日→投诉质疑答复期满 15 日内向财政部门（94号令，非招投标投诉 10 日内向行政监督部门）；新增政采特有盲区（中小企业声明函真实性/划型、信用中国+中国政府采购网查询、节能环标强制品目、进口产品财政核准、专门面向资格、政策功能价格扣除）；保证金改按"预算金额≤2%"（非估算价）；明确政采异常低价仅要求说明、无"低于成本"强制否决（区别于招投标）；增设招投标硬隔离红线（工程依法必招→导流 bidding-compliance-advisor）。保留四级判定标尺、必查盲区强制校验、硬性输出契约、内置法条离线兜底、多轮状态管理与统一署名脚注。
