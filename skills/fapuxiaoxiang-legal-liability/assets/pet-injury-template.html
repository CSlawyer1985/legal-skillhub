}

var sel = function(qid,val,el){
  var labels=el.parentElement.querySelectorAll('label');
  for(var i=0;i<labels.length;i++) labels[i].classList.remove('sel');
  el.classList.add('sel');
  a[qid]=val;
  var ext=document.getElementById('ext_'+qid);
  if(ext) ext.classList.add('show');
  updateProgress();
  var qb=el.closest('.qb');
  if(qb){
    var next=qb.nextElementSibling;
    while(next && !next.classList.contains('qb')) next=next.nextElementSibling;
    if(next) next.classList.add('active');
  }
};

var extInput = function(qid,val){
  if(val) a[qid+'_ext']=val;
};

function updateProgress(){
  var n=0;
  for(var k in a){
    if(k.match(/^q\d+$/) && !k.match(/_ext$/)) n++;
  }
  var pct=Math.round(n/5*100);
  if(pct>100) pct=100;
  document.getElementById('done').textContent=n;
  document.getElementById('pct').textContent=pct;
  document.getElementById('progFill').style.width=pct+'%';
  if(n>=5){
    document.getElementById('analyzeBtn').disabled=false;
    document.getElementById('analyzeBtn').textContent='🔍 算算我能拿多少钱';
  }else{
    document.getElementById('analyzeBtn').disabled=true;
    document.getElementById('analyzeBtn').textContent='请先回答完所有问题（'+n+'/5）';
  }
}

// ═══════════════════════════════════
// 计算逻辑（按狗类型分支，案例不交叉）
function calc(){
  var r={type:'',ratio:0,pct:'',msg:'',cases:[],amt:'',feeTotal:0};
  var dogType=a.q1, safety=a.q2, action=a.q3, inj=a.q4, fees=a.q5;
  var ratio=100;

  // ═══ ① 禁养/烈性犬（第1247条）→ 绝对全责 ═══
  if(dogType==='banned'){
    r.type='c'; ratio=100;
    r.cases=[CASES[0],CASES[8]]; // 阿拉斯加案+吉林再审案
    r.msg='咬人的是禁养或禁止饲养的烈性犬/大型犬。根据民法典第1247条，无论受害人有无过错，饲养人均承担全部赔偿责任。';
  }

  // ═══ ② 流浪狗 → 找原主人/物业/投喂者 ═══
  else if(dogType==='stray'){
    r.type='a'; ratio=60;
    r.cases=[CASES[9],CASES[10],CASES[11]]; // 郴州案+奉新案+定西案
    r.msg='流浪狗咬人，首选找原饲养人赔偿（民法典第1249条）。找不到原主人时，物业有过错（明知流浪狗不管）由物业赔，长期投喂者也要担责。';
  }

  // ═══ ③ 普通犬/大型犬 → 看过错+安全措施 ═══
  else {
    // 受害人过错判定
    if(action==='provoke'){
      ratio=50; r.type='a';
      r.cases=[CASES[7]]; // 宁夏银川案：受害人逗狗自担20%
      r.msg='你挑逗/攻击了狗，属于重大过失。根据民法典第1245条，饲养人可以减轻责任（约各担50%）。';
    }else if(action==='touch'){
      ratio=80; r.type='a';
      r.cases=[CASES[7]]; // 同上，但比例更轻
      r.msg='你主动去摸/逗狗，可能构成重大过失。主人通常承担大部分责任（约80%），你承担约20%。';
    }else if(action==='kid'){
      r.type='c'; ratio=100;
      r.cases=[CASES[15]]; // 河南驻马店案：小孩摸普通犬不减责
      r.msg='小孩不懂事摸狗，属于一般过失，不减轻饲养人责任。饲养人承担全部赔偿责任。';
    }else{
      r.type='c'; ratio=100;
      r.cases=[CASES[6],CASES[14]]; // 荆门案+北京案：路人无过错
      r.msg='你正常路过/无招惹行为，饲养人应当承担100%赔偿责任（民法典第1245条）。';
    }

    // 安全措施违规 → 加重
    if(safety==='noleash'||safety==='child'){
      r.type='c';
      r.msg+=' 此外，狗主人未采取安全措施（不拴绳/让小孩遛狗），根据民法典第1246条，即使你有过失，主人也不能完全免责。';
      // 补充案例：最高法案例二（小孩遛狗）
      r.cases.push(CASES[1]);
    }
  }

  r.ratio=ratio;
  r.pct=ratio===100?'狗主人承担全部赔偿责任':'狗主人承担约'+ratio+'%责任';

  // ═══ 总费用计算 ═══
  var totalFee=0;
  var feeMap={lt1000:500,lt5000:3000,lt20000:10000,gt20000:30000};
  totalFee=feeMap[fees]||500;
  // 具体数字
  if(fees==='number'){
    totalFee=a.q5_ext?parseFloat(a.q5_ext):0;
    if(!a.q5_ext){r.msg+=' ⚠️ 请在上方输入框填写具体费用。';}
  }

  // 伤情加重（额外加成，不在比例折扣范围内）
  if(inj==='disable'){totalFee+=50000;r.msg+=' 构成伤残等级，可主张残疾赔偿金。';}
  if(inj==='face'){totalFee+=20000;r.msg+=' 面部受伤/毁容，可主张精神损害抚慰金。';}
  if(inj==='pregnant'){totalFee+=2000;r.msg+=' 孕妇被咬，可能影响胎儿，法院支持赔偿。';r.cases=[CASES[3]];}
  if(inj==='disable'||inj==='face'||inj==='pregnant'){
    r.msg+=' 注意：精神损害抚慰金通常在达到伤残或严重后果时支持。';
  }

  // 赔偿 = 总费用 × 责比（伤残费全额不折扣）
  var baseFee=totalFee-({
    disable:50000,face:20000,pregnant:2000
  }[inj]||0);
  var bonusFee=totalFee-baseFee;
  r.feeTotal=Math.round(baseFee*ratio/100+bonusFee);
  r.amt=r.feeTotal>0?r.feeTotal.toLocaleString():'需协商';

  return r;
}

// ═══════════════════════════════════
// 显示结果
// ═══════════════════════════════════
function render(r){
  var html='';
  var cls=r.type||'g';
  var tag=cls==='c'?'违法行为·可主张全赔':(cls==='a'?'双方过错·按比例赔':'可协商赔偿');

  html+='<h2>赔偿预判</h2>';
  html+='<div class="r '+cls+'">'+tag+'</div>';
  html+='<div class="desc">'+r.msg+'</div>';
  html+='<div class="mtx" style="text-align:center;margin:16px 0"><span style="font-size:22px;font-weight:800;color:'+(cls==='c'?'var(--c)':cls==='a'?'#854f0b':'var(--g)')+'">'+r.amt+'</span><span style="font-size:14px;color:var(--ts)"> 元（预估区间）</span></div>';
  html+='<div class="law">📖 民法典第1245-1251条 · 饲养动物损害责任<br>'+r.pct+'</div>';

  // 案例
  html+='<div style="margin-top:16px"><strong style="font-size:14px">📚 参考案例</strong></div>';
  for(var i=0;i<r.cases.length;i++){
    var c=r.cases[i];
    html+='<div class="case"><div class="ctitle">'+c.title+'</div><div class="cinfo">'+c.court+' · '+c.fact+'</div><div class="cresult"><span class="tag '+c.type+'">'+c.tag+'</span> '+c.result+'</div></div>';
  }

  document.getElementById('resultContent').innerHTML=html;
  document.getElementById('result').classList.add('active');
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

document.getElementById('analyzeBtn').onclick=function(){
  var r=calc();
  render(r);
};

function genLongImage(){
  var el=document.getElementById('result');
  html2canvas(el,{scale:2,backgroundColor:'#f5f3ef',useCORS:true,allowTaint:true})
    .then(function(canvas){
      document.getElementById('longImg').src=canvas.toDataURL('image/png');
      document.getElementById('overlay').classList.add('show');
    });
}

renderQuestions();
