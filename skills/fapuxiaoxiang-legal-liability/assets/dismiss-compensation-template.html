var sel = function(qid,val,el){
  // deselect others
  var labels=el.parentElement.querySelectorAll('label');
  for(var i=0;i<labels.length;i++) labels[i].classList.remove('sel');
  el.classList.add('sel');
  a[qid]=val;
  // show ext if hasInput
  var ext=document.getElementById('ext_'+qid);
  if(ext) ext.classList.add('show');
  updateProgress();
  // 自动切到下一题
  var qb=el.closest('.qb');
  if(qb){
    var next=qb.nextElementSibling;
    while(next && !next.classList.contains('qb')) next=next.nextElementSibling;
    if(next) next.classList.add('active');
  }
};

var extInput = function(qid,val){
  if(val) a[qid+'_ext']=val;
};

function updateProgress(){
  var n=0;
  for(var k in a){
    if(k.match(/^q\d+$/) && !k.match(/_ext$/)) n++;
  }
  var pct=Math.round(n/6*100);
  if(pct>100) pct=100;
  document.getElementById('done').textContent=n;
  document.getElementById('pct').textContent=pct;
  document.getElementById('progFill').style.width=pct+'%';

  if(n>=6){
    document.getElementById('analyzeBtn').disabled=false;
    document.getElementById('analyzeBtn').textContent='🔍 算算我能拿多少钱';
  }else{
    document.getElementById('analyzeBtn').disabled=true;
    document.getElementById('analyzeBtn').textContent='请先回答完所有问题（'+n+'/6）';
  }
}

}

function calc(){
  var r={type:'N',n:0,base:0,total:0,msg:'',cases:[],isProtected:false};

  // 工作年限N
  var years=calcYears(a.q2);
  r.n=years;

  // 工资基数
  var salary=calcSalary(a.q3);
  if(a.q3_ext) salary=parseFloat(a.q3_ext)||salary;
  r.base=salary;

  // 判断解除类型
  var reason=a.q1;
  var notice=a.q4;
  var special=a.q5;
  var signed=a.q6;

  // 特殊保护期 - 基本可以认定违法解除
  if(special==='preg'||special==='sick'||special==='injury'){
    r.isProtected=true;
  }

  // ⭐ 优先判断：特殊保护期 → 2N
  if(r.isProtected){
    r.type='2N';
    r.total=salary*years*2;
    r.msg='你在特殊保护期内被辞退，基本可认定为违法解除。公司应当支付2N赔偿金。';
    r.cases=[CASES[3],CASES[4]];
    return r;
  }

  // ⭐ 优先判断：直接开除 → 2N（不管是否签了个人原因辞职）
  if(reason==='fire'){
    r.type='2N';
    r.total=salary*years*2;
    r.msg='公司没有合法理由直接开除，属于违法解除劳动合同。应按2N标准支付赔偿金。';
    r.cases=[CASES[0],CASES[1],CASES[2],CASES[5]];
    return r;
  }

  // 签了"因个人原因辞职"的后果（在fire之后判断，避免冲突）
  if(reason==='resign'||signed==='personal'){
    r.type='不适用';
    r.msg='签了"因个人原因辞职"，通常拿不到经济补偿。但如果有特殊情况（公司拖欠工资、不缴社保等），可主张被迫辞职的经济补偿。';
    r.cases=[CASES[10]];
    return r;
  }

  // 不能胜任/医疗期满 → N+1（没提前通知的话）
  if(reason==='incompetent'){
    if(notice==='no'||notice==='pay'){
      r.type='N+1';
      r.total=salary*(years+1);
      r.msg='公司以不能胜任/医疗期满为由解除，属于法定解除。未提前30天通知，应支付N+1。注意：公司不能仅凭"末位"直接开除。';
      r.cases=[CASES[8],CASES[9]];
    }else{
      r.type='N';
      r.total=salary*years;
      r.msg='公司提前30天通知了，属于合法的法定解除。只需支付N（经济补偿）。';
      r.cases=[CASES[8]];
    }
    return r;
  }

  // 协商一致 / 合同到期 → N
  if(reason==='consent'||reason==='expire'){
    r.type='N';
    r.total=salary*years;
    r.msg='协商解除或合同到期不续签，属于合法解除。公司应支付N（经济补偿）。';
    r.cases=[CASES[6],CASES[7]];
    return r;
  }

  // 裁员 → N
  if(reason==='layoff'){
    r.type='N';
    r.total=salary*years;
    r.msg='公司以裁员/经营困难为由解除，属于法定的经济性裁员。应支付N。如果认为公司以裁员为借口违法开除，可主张2N。';
    r.cases=[CASES[6],CASES[7]];
    return r;
  }

  return r;
}

// ═══════════════════════════════════
// 显示结果
// ═══════════════════════════════════

function render(r){
  var html='';

  if(r.type!=='不适用'){
    var cls='g';
    var tag='大概率能拿到';
    if(r.type==='2N'){
      cls='c';tag='违法解除·可主张2N';
    }else if(r.type==='N+1'){
      cls='a';tag='法定解除·可主张N+1';
    }

    html+='<h2>你的赔偿预判</h2>';
    html+='<div class="r '+cls+'">'+tag+'</div>';
    html+='<div class="amt">'+(r.total>0?r.total.toLocaleString():'0')+'<span class="unit"> 元</span></div>';
    html+='<div class="desc">'+r.msg+'</div>';
    if(r.type==='N+1'||r.type==='N'){
      html+='<div class="law">📖 《劳动合同法》第47条 · 人民法院案例库<br>N='+Math.round(r.n)+'年 × 月均'+r.base.toLocaleString()+'元 = '+(r.base*Math.round(r.n)).toLocaleString()+'元'+(r.type==='N+1'?'<br>+1 = '+r.base.toLocaleString()+'元（代通知金）':'')+'</div>';
    }
    if(r.type==='2N'){
      html+='<div class="law">📖 《劳动合同法》第87条 · 人民法院案例库<br>2N = 2 × '+Math.round(r.n)+'年 × 月均'+r.base.toLocaleString()+'元</div>';
    }

    // 案例
    html+='<div style="margin-top:16px"><strong style="font-size:14px">📚 参考案例</strong></div>';
    for(var i=0;i<r.cases.length;i++){
      var c=r.cases[i];
      html+='<div class="case"><div class="ctitle">'+c.title+'</div><div class="cinfo">'+c.court+' · '+c.fact+'</div><div class="cresult"><span class="tag '+c.type+'">'+c.tag+'</span> '+c.result+'</div></div>';
    }

  }else{
    html+='<h2>你的赔偿预判</h2>';
    html+='<div class="r" style="background:var(--aml);color:#854f0b">⚠️ 一般拿不到经济补偿</div>';
    html+='<div class="amt">0<span class="unit"> 元</span></div>';
    html+='<div class="desc">'+r.msg+'</div>';
    if(r.cases&&r.cases.length>0){
      html+='<div style="margin-top:16px"><strong style="font-size:14px">📚 参考案例</strong></div>';
      for(var i=0;i<r.cases.length;i++){
        var c=r.cases[i];
        html+='<div class="case"><div class="ctitle">'+c.title+'</div><div class="cinfo">'+c.court+' · '+c.fact+'</div><div class="cresult"><span class="tag '+c.type+'">'+c.tag+'</span> '+c.result+'</div></div>';
      }
    }
  }

  document.getElementById('resultContent').innerHTML=html;
  document.getElementById('result').classList.add('active');

  // scroll to result
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

// ═══════════════════════════════════
// 分析
// ═══════════════════════════════════

document.getElementById('analyzeBtn').onclick=function(){
  var r=calc();
  render(r);
};
