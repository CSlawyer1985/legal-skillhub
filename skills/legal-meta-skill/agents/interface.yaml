interface:
  display_name: "CSlawyer 法律类元 Skill"
  short_description: "创建、改造、审计与评测中国大陆可复用法律 Skill"
  default_prompt: "使用 $legal-meta-skill 创建、改造、审计或评测可复用的中国大陆法律 Skill。先完成 intake 与 12 模块适用性记录，再用包内生成器形成自包含目标包，并按声明成熟度运行结构、路由、法律输出和证据门禁。仅在用户授权范围内写入目标 Skill，未经授权不得发布或远程同步。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "description"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "本地优先"
    remote_inline_execution: "禁止"
    remote_metadata_policy: "仅在用户要求时允许只读来源审查"
    generated_claims: "以证据为界"
  permissions:
    network: "默认关闭；仅在必要或用户要求时进行只读既有方案/法律来源研究"
    file_write: "仅写入目标 Skill 包及其 scratch/output 产物"
    subprocess: "仅运行本地验证和用户批准的确定性工具"
    interactive: "除非用户明确授权认证流程，否则避免交互式操作"
  degradation:
    openai: "使用 frontmatter 加包内参考文件"
    claude: "使用中立源文件加包内规则参考"
    generic: "使用中立源文件并显式标注证据边界"
gates:
  # 本文件 gates 为摘要展示，权威门禁标准以 references/legal-quality-gates.md 为准。
  "草案级（scaffold）":
    - "准确的 SKILL.md frontmatter 与排除项"
    - "自然触发、反向排除和近邻场景示例"
  "专业复用级（production）":
    - "agents/interface.yaml"
    - "触发评测"
    - "法律输出契约"
    - "本地验证与安装检查"
    - "场景原型选定与对应检查清单"
  "基础设施级（library）":
    - "reports/skill-ir.json"
    - "既有方案取舍报告"
    - "信任边界"
    - "复核周期与负责人"
  "高风险治理级（governed）":
    - "文件型夹具（file-backed fixture）政策"
    - "回滚边界"
    - "密钥与权限审查"
    - "输出或人工复核证据"
    - "明确的证据缺失（missing evidence）台账"
