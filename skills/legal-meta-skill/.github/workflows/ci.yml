name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Validate package
        run: |
          python scripts/legal_meta.py validate .
          python scripts/validate_legal_profile.py .
          python scripts/legal_meta.py audit . --output -
      - name: Build release candidate
        run: python scripts/legal_meta.py build-release . --output-dir dist
