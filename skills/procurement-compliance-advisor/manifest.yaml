    change: 融合用户 v2.0 规范——角色 Persona、六大功能输出契约模板、Few-shot 三示例、边缘情况处理表、引用规范统一要求法条名称+条款+文号；修正失效 KB ID 为真实库 7463496212028405（主源）+ 7450416392468005（质疑投诉辅源）；软化知识库检索约束为跨环境可降级（KB无果→网络补检、工具不可用→公开法规并标注）；两法边界单一判定规则；署名仅存于元数据与说明页、不写入输出。
  - version: 2.0.1
    date: 2026-07-24
    change: 回归测试（IMA 真实样本）发现并修正模块⑤政策口径——货物服务价格扣除由 6%–10% 更新为 10%–20%（财库〔2022〕19号，2022-07-01 起），补充联合体/分包 4%–6%（工程1%–2%）、工程超400万预留份额阶段性≥40%；新增「未预留份额须论证不适宜中小企业提供」提示。
