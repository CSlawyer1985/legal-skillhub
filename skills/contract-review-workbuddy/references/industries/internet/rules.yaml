rules:
  # ==================== 软件开发/外包 ====================
  - id: NET001
    category: software_development
    name: "知识产权归属约定不明"
    description: "软件开发合同未明确约定开发成果的知识产权归属，可能导致委托方无法取得源码和著作权"
    severity: critical
    check_type: prompt_check
    check_rule: "核查合同是否明确约定开发成果（含源码、文档、设计）的知识产权归属，以及背景知识产权的使用范围"
    legal_basis: "《民法典》第887条；《著作权法》第19条；《计算机软件保护条例》第11条"
    suggestion: "明确约定开发成果著作权归委托方所有，受托方保留背景知识产权并授予委托方永久、不可撤销的使用许可"
    enabled: true

  - id: NET002
    category: software_development
    name: "源代码交付与第三方托管(Escrow)缺失"
    description: "定制开发合同未约定源代码交付及第三方托管条款，开发方破产或违约时委托方无法取得源码"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定开发方应交付完整源代码、技术文档，以及是否设立第三方托管(Escrow)机制"
    legal_basis: "《民法典》第807条；《计算机软件保护条例》第10条"
    suggestion: "约定分阶段交付源码和文档，设立独立第三方托管，明确触发托管释放的条件（如开发方破产、重大违约）"
    enabled: true

  - id: NET003
    category: software_development
    name: "验收标准与测试流程不明确"
    description: "合同未约定明确的验收标准、测试流程和验收通过条件，导致验收扯皮"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定功能验收标准（需求规格说明书附件）、性能测试指标、验收测试流程和异议期限"
    legal_basis: "《民法典》第621条、第623条"
    suggestion: "以需求规格说明书为验收基准，约定UAT测试周期、缺陷等级分类（致命/严重/一般）、验收通过标准和复验程序"
    enabled: true

  - id: NET004
    category: software_development
    name: "里程碑付款节点与成果未挂钩"
    description: "付款仅按时间节点而非成果交付节点支付，开发方延迟交付时委托方已支付大部分款项"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同付款条件是否与阶段性成果交付（需求确认、设计评审、Beta版本、终验）挂钩"
    legal_basis: "《民法典》第626条、第628条"
    suggestion: "采用里程碑付款，每节点付款需提交对应成果并通过审核，尾款比例不低于20%待终验后支付"
    enabled: true

  - id: NET005
    category: software_development
    name: "需求变更管理条款缺失"
    description: "合同未约定需求变更的审批流程、工期调整和费用补偿机制"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定需求变更的提出方式、审批程序、对工期和费用的影响确认机制"
    legal_basis: "《民法典》第543条、第533条"
    suggestion: "建立需求变更控制委员会(CCB)，约定变更须在5个工作日内提交影响评估，双方书面确认后生效"
    enabled: true

  - id: NET006
    category: software_development
    name: "开发延期违约金条款缺失"
    description: "合同未约定开发方延期交付的违约金标准，委托方难以追究延期责任"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定延期违约金计算方式（如按日计算比例）和累计上限"
    legal_basis: "《民法典》第585条"
    suggestion: "约定延期违约金按合同总额日万分之五计算，累计不超过合同总额20%，超期30日委托方有权解除合同"
    enabled: true

  - id: NET007
    category: software_development
    name: "开源组件许可(GPL传染性)风险"
    description: "开发方在开发过程中使用GPL/AGPL等强传染性开源组件，导致委托方自有代码被迫开源"
    severity: critical
    check_type: prompt_check
    check_rule: "核查合同是否约定开发方不得使用GPL/AGPL等强传染性开源组件，或需事先取得委托方书面同意"
    legal_basis: "《计算机软件保护条例》第16条；GPLv3许可协议"
    suggestion: "约定开发方提供开源组件清单（SBOM），禁止使用GPL/AGPL组件，使用MIT/Apache2.0需声明并确认兼容"
    enabled: true

  - id: NET008
    category: software_development
    name: "保密义务条款不完整"
    description: "保密条款未明确保密信息范围、保密期限和违反保密义务的违约金"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否明确保密信息定义、保密期限（合同终止后仍有效）、返还或销毁要求及违约责任"
    legal_basis: "《民法典》第501条；《反不正当竞争法》第9条"
    suggestion: "保密期限不少于合同终止后3年，约定违约金或实际损失赔偿，明确电子数据的删除验证方式"
    enabled: true

  - id: NET009
    category: software_development
    name: "核心开发人员锁定与竞业缺失"
    description: "合同未约定开发方锁定核心开发人员，或人员更换需委托方同意"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定核心人员名单、人员更换条件、竞业限制和知识交接要求"
    legal_basis: "《民法典》第509条"
    suggestion: "锁定项目经理和架构师，人员更换需提前30天书面通知并经委托方批准，新成员需具备同等资质"
    enabled: true

  - id: NET010
    category: software_development
    name: "运维期与响应时效条款缺失"
    description: "合同未约定系统上线后的运维服务级别、响应时效和问题升级机制"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定运维期限、SLA响应时效（如P1级故障30分钟响应）、问题分级和升级路径"
    legal_basis: "《民法典》第620条"
    suggestion: "约定不少于12个月免费运维期，P1故障30分钟响应/4小时修复，P2故障2小时响应/8小时修复"
    enabled: true

  - id: NET011
    category: software_development
    name: "质保期与Bug修复条款缺失"
    description: "合同未约定质保期内免费修复Bug的范围、时限和质保期后维护费用标准"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定质保期限、缺陷等级对应的修复时限、质保期后维护费率"
    legal_basis: "《民法典》第620条、第621条"
    suggestion: "质保期不少于12个月，致命缺陷24小时修复、严重缺陷72小时修复，质保期后维护费率不超过合同总额15%/年"
    enabled: true

  - id: NET012
    category: software_development
    name: "开发方破产源码处置条款缺失"
    description: "合同未约定开发方破产、解散时源代码、文档和数据的提前交付义务"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定开发方经营异常时的预警义务和源码提前交付机制"
    legal_basis: "《民法典》第527条；《企业破产法》第18条"
    suggestion: "约定开发方出现经营异常应在30日内通知委托方，并提前交付全部源码、文档和数据至第三方托管"
    enabled: true

  # ==================== SaaS/云服务 ====================
  - id: NET013
    category: saas_service
    name: "SLA可用性承诺与赔偿缺失"
    description: "SaaS服务合同未约定服务可用性指标（如99.9%）及未达标的赔偿机制"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定月度可用性计算公式（不含计划内维护）、可用性分级和对应的服务费抵扣比例"
    legal_basis: "《民法典》第577条；《电子商务法》第32条"
    suggestion: "承诺月度可用性不低于99.9%，每低0.1%抵扣当月服务费5%，低于98%用户有权解除合同"
    enabled: true

  - id: NET014
    category: saas_service
    name: "数据所有权归属未明确"
    description: "SaaS合同未明确用户数据的所有权归属，平台可能擅自使用用户数据"
    severity: critical
    check_type: prompt_check
    check_rule: "核查合同是否明确用户对上传数据的所有权，以及平台使用用户数据的范围和限制"
    legal_basis: "《数据安全法》第3条；《个人信息保护法》第13条；《民法典》第127条"
    suggestion: "明确用户数据所有权归用户，平台仅限为提供服务目的使用，不得用于训练模型或向第三方共享"
    enabled: true

  - id: NET015
    category: saas_service
    name: "数据导出与退出机制缺失"
    description: "SaaS合同未约定服务终止后用户数据的导出格式、时限和完整性保证"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定合同终止后数据的导出格式（如CSV/JSON）、导出时限和数据删除确认"
    legal_basis: "《个人信息保护法》第47条；《数据安全法》第27条"
    suggestion: "服务终止后30日内提供完整数据导出（标准格式），导出后90日内彻底删除并出具删除证明"
    enabled: true

  - id: NET016
    category: saas_service
    name: "终止后数据删除条款缺失"
    description: "合同未约定服务终止后平台删除用户数据的义务、时限和验证方式"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定数据删除范围（含备份数据）、删除时限和独立第三方审计验证"
    legal_basis: "《个人信息保护法》第47条；《数据安全法》第27条"
    suggestion: "服务终止后90日内删除全部数据（含备份），提供删除确认函，用户有权委托第三方审计验证"
    enabled: true

  - id: NET017
    category: saas_service
    name: "服务商单方涨价条款"
    description: "合同赋予服务商单方面调整服务价格的权利，客户被动接受不合理涨价"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定服务费调整机制，是否赋予服务商单方涨价权及涨幅上限"
    legal_basis: "《民法典》第543条；《电子商务法》第34条"
    suggestion: "禁止单方涨价，续约期价格调整需提前60日书面通知且涨幅不超过CPI或5%，用户有权拒绝并解除合同"
    enabled: true

  - id: NET018
    category: saas_service
    name: "单方变更服务条款权利"
    description: "合同允许服务商单方面变更服务功能、SLA标准等核心条款"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否限制服务商单方变更核心条款（功能、SLA、隐私政策），是否需用户同意"
    legal_basis: "《电子商务法》第34条；《民法典》第496条"
    suggestion: "核心条款变更需提前30日通知并经用户书面同意，用户不同意可解除合同并获得未消费费用退款"
    enabled: true

  - id: NET019
    category: saas_service
    name: "多租户数据隔离措施缺失"
    description: "SaaS多租户架构未约定数据隔离措施，存在租户间数据泄露风险"
    severity: critical
    check_type: prompt_check
    check_rule: "核查合同是否约定多租户数据隔离方案（逻辑隔离或物理隔离）、安全审计和渗透测试要求"
    legal_basis: "《网络安全法》第21条；《数据安全法》第27条"
    suggestion: "采用逻辑隔离+加密存储，每年进行第三方渗透测试，数据泄露时服务商承担全部赔偿责任"
    enabled: true

  - id: NET020
    category: saas_service
    name: "备份灾备RPO/RTO指标缺失"
    description: "合同未约定数据恢复点目标(RPO)和恢复时间目标(RTO)，灾备能力不明确"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定RPO（数据恢复点目标）和RTO（恢复时间目标）指标，以及灾备演练频率"
    legal_basis: "《数据安全法》第27条；《网络安全法》第34条"
    suggestion: "RPO不超过1小时、RTO不超过4小时，每季度进行一次灾备演练并出具报告"
    enabled: true

  - id: NET021
    category: saas_service
    name: "赔偿责任上限过低"
    description: "合同将服务商赔偿责任上限限定为月服务费，远低于用户实际损失"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同中的责任限制条款，是否将赔偿上限限定为月/年服务费，是否排除数据泄露和重大过失"
    legal_basis: "《民法典》第506条；《消费者权益保护法》第26条"
    suggestion: "责任上限不低于年服务费3倍，数据泄露、重大过失和知识产权侵权不适用责任限制"
    enabled: true

  - id: NET022
    category: saas_service
    name: "服务降级与限流条款缺失"
    description: "合同未约定服务商进行服务降级、限流时的通知义务和补偿机制"
    severity: low
    check_type: prompt_check
    check_rule: "核查合同是否约定服务降级条件、提前通知时限和对应的服务费减免"
    legal_basis: "《民法典》第509条"
    suggestion: "计划性降级需提前72小时通知，每月累计降级超过4小时减免当月服务费10%"
    enabled: true

  - id: NET023
    category: saas_service
    name: "账号数超额计费规则不明"
    description: "SaaS合同未约定账号超额使用的计费标准和结算方式"
    severity: low
    check_type: prompt_check
    check_rule: "核查合同是否约定账号类型定义、超额计费单价、计费周期和结算方式"
    legal_basis: "《民法典》第510条"
    suggestion: "明确账号类型（管理员/普通/只读），超额按阶梯单价计费，按月结算并提供用量明细"
    enabled: true

  - id: NET024
    category: saas_service
    name: "自动续约展期条款缺失"
    description: "合同到期自动续约但未约定提前通知期和终止便捷性，用户被动续费"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定自动续约的提前通知期限（如60日）和用户终止续约的便捷方式"
    legal_basis: "《电子商务法》第19条；《消费者权益保护法》第9条"
    suggestion: "自动续约需提前60日通知，用户可在到期前任意时间以书面或在线方式终止续约"
    enabled: true

  # ==================== 数据合规 ====================
  - id: NET025
    category: data_compliance
    name: "个人信息告知同意缺失"
    description: "产品/服务收集个人信息未取得用户知情同意，隐私政策缺失或告知不充分"
    severity: critical
    check_type: prompt_check
    check_rule: "核查是否提供隐私政策，是否明确告知收集目的、方式、范围、保存期限，并取得用户主动同意"
    legal_basis: "《个人信息保护法》第13条、第14条、第17条"
    suggestion: "隐私政策单独弹窗提示，采用 opt-in 方式获取同意，提供撤回同意入口，记录同意时间戳"
    enabled: true

  - id: NET026
    category: data_compliance
    name: "最小必要原则违反"
    description: "App/软件收集超出服务必要范围的个人信息（如计算器App读取通讯录）"
    severity: critical
    check_type: prompt_check
    check_rule: "核查收集的个人信息类型是否与提供服务有直接关联，是否存在过度收集"
    legal_basis: "《个人信息保护法》第6条；《App违法违规收集使用个人信息行为认定方法》"
    suggestion: "遵循最小必要原则，仅收集实现服务功能所必需的信息，不得因用户拒绝提供非必要信息而拒绝服务"
    enabled: true

  - id: NET027
    category: data_compliance
    name: "敏感个人信息单独同意缺失"
    description: "收集生物识别、医疗健康、金融账户等敏感个人信息未取得单独同意"
    severity: critical
    check_type: prompt_check
    check_rule: "核查是否对敏感个人信息取得用户的单独同意，是否告知处理的必要性和对个人的影响"
    legal_basis: "《个人信息保护法》第28条、第29条、第30条"
    suggestion: "敏感信息收集前需单独弹窗明示同意，告知处理必要性和影响，未成年人信息还需监护人同意"
    enabled: true

  - id: NET028
    category: data_compliance
    name: "数据出境安全评估/标准合同缺失"
    description: "向境外传输个人信息未通过安全评估或签订标准合同，违反数据出境规定"
    severity: critical
    check_type: prompt_check
    check_rule: "核查是否存在数据出境场景，是否完成安全评估申报或签订个人信息出境标准合同"
    legal_basis: "《数据出境安全评估办法》第4条；《个人信息保护法》第38条"
    suggestion: "数据出境前开展风险评估，达到申报门槛的向网信部门申报安全评估，否则签订标准合同备案"
    enabled: true

  - id: NET029
    category: data_compliance
    name: "委托处理协议(DPA)缺失"
    description: "委托第三方处理个人信息未签订委托处理协议，未约定处理目的和双方责任"
    severity: high
    check_type: prompt_check
    check_rule: "核查是否与数据处理服务商签订委托处理协议，约定处理目的、期限、方式和双方义务"
    legal_basis: "《个人信息保护法》第21条"
    suggestion: "签订DPA明确处理目的、期限、方式、数据类型，约定处理结束后返还或删除，禁止转委托"
    enabled: true

  - id: NET030
    category: data_compliance
    name: "数据安全责任划分不清"
    description: "多方参与的数据处理场景未明确各方数据安全责任边界"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否明确数据控制者、处理者、子处理者的安全责任划分，约定安全事件的责任归属"
    legal_basis: "《数据安全法》第27条；《个人信息保护法》第21条、第59条"
    suggestion: "按数据处理角色划分责任，控制者承担总体责任，处理者按指令处理并配合安全事件响应"
    enabled: true

  - id: NET031
    category: data_compliance
    name: "数据泄露通知义务缺失"
