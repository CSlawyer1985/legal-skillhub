rules:
  # ==================== 医疗器械采购合同 ====================
  - id: MED001
    category: medical_device
    name: "医疗器械注册证缺失"
    description: "采购的医疗器械未取得医疗器械注册证或备案凭证"
    severity: critical
    check_type: prompt_check
    check_rule: "核查供应商是否提供有效期内的医疗器械注册证或备案凭证，确认产品分类管理类别"
    legal_basis: "《医疗器械监督管理条例》第13条、第41条、第81条"
    suggestion: "要求供应商提供医疗器械注册证或备案凭证原件扫描件，核实产品名称、规格型号、适用范围、有效期等信息，并在国家药监局官网查询验证"
    enabled: true

  - id: MED002
    category: medical_device
    name: "医疗器械注册证过期"
    description: "供应商提供的医疗器械注册证已超过有效期未延续"
    severity: critical
    check_type: prompt_check
    check_rule: "核查医疗器械注册证有效期及注册人是否按时申请延续注册"
    legal_basis: "《医疗器械监督管理条例》第14条、第81条"
    suggestion: "核实注册证有效期届满时间，要求供应商提供延续注册受理通知书或新注册证，必要时暂停采购直至完成延续"
    enabled: true

  - id: MED003
    category: medical_device
    name: "采购范围超出注册证适用范围"
    description: "合同约定采购的医疗器械超出注册证批准的适用范围"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同约定的产品适用范围是否超出注册证批准的适用范围"
    legal_basis: "《医疗器械监督管理条例》第41条、第86条"
    suggestion: "要求供应商出具注册证副本及附件（注册产品标准/产品技术要求），核实适用范围是否覆盖合同约定的使用场景"
    enabled: true

  - id: MED004
    category: medical_device
    name: "供应商经营资质缺失"
    description: "医疗器械经营企业未取得相应经营许可证或备案凭证"
    severity: critical
    check_type: prompt_check
    check_rule: "核查供应商的医疗器械经营许可证或备案凭证是否有效，经营范围是否覆盖所供产品"
    legal_basis: "《医疗器械监督管理条例》第40条、第42条、第82条"
    suggestion: "要求供应商提供医疗器械经营许可证/备案凭证，核实经营范围、有效期，并在省级药监局官网查询核实"
    enabled: true

  - id: MED005
    category: medical_device
    name: "进口医疗器械缺少进口注册证"
    description: "进口医疗器械未取得进口医疗器械注册证或备案凭证"
    severity: critical
    check_type: prompt_check
    check_rule: "核查进口医疗器械是否取得国家药监局核发的进口医疗器械注册证"
    legal_basis: "《医疗器械监督管理条例》第13条、第57条、第81条"
    suggestion: "要求供应商提供进口医疗器械注册证、代理委托书、原产地证明、报关单等全套进口资质文件"
    enabled: true

  - id: MED006
    category: medical_device
    name: "冷链运输条款缺失"
    description: "需冷链运输的医疗器械合同未约定运输条件和温控要求"
    severity: high
    check_type: prompt_check
    check_rule: "核查是否需要冷链运输的医疗器械是否约定运输温度、时限、交接验收标准"
    legal_basis: "《医疗器械监督管理条例》第45条、《医疗器械经营质量管理规范》"
    suggestion: "在合同中明确冷链运输的温度范围、运输时限、温控设备要求、交接验收标准和温度记录要求"
    enabled: true

  - id: MED007
    category: medical_device
    name: "产品验收标准不明确"
    description: "合同未明确医疗器械的验收标准和验收流程"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定产品验收标准、验收流程、不合格品处理方式"
    legal_basis: "《医疗器械监督管理条例》第45条、《民法典》第621条"
    suggestion: "明确约定验收依据（注册证产品技术要求、国家标准/行业标准）、验收程序、抽样比例、不合格品退换货条款"
    enabled: true

  - id: MED008
    category: medical_device
    name: "不良事件监测义务约定缺失"
    description: "合同未约定医疗器械不良事件监测和报告义务"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定不良事件监测、报告及配合召回义务"
    legal_basis: "《医疗器械不良事件监测和再评价管理办法》第6条、第15条"
    suggestion: "在合同中约定不良事件发现后的报告时限、配合调查义务、召回配合责任及信息通报机制"
    enabled: true

  - id: MED009
    category: medical_device
    name: "召回责任约定缺失"
    description: "合同未约定医疗器械召回时的责任承担和处理流程"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否明确召回情形、责任主体、费用承担、时限要求"
    legal_basis: "《医疗器械召回管理办法》第5条、第16条、第20条"
    suggestion: "明确约定召回分级（一级/二级/三级）、各方责任、费用分担、时限要求、库存处理和患者补偿机制"
    enabled: true

  - id: MED010
    category: medical_device
    name: "售后服务条款缺失"
    description: "合同未约定医疗器械的安装调试、技术培训、维修保养等售后服务"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定安装调试、技术培训、维修保养、零配件供应等售后服务条款"
    legal_basis: "《医疗器械使用质量监督管理办法》第5条、第10条"
    suggestion: "明确约定售后响应时间、维修时限、培训内容、保修期、保修期后服务费用标准、零配件供应保证期"
    enabled: true

  - id: MED011
    category: medical_device
    name: "植入类医疗器械追溯条款缺失"
    description: "植入类医疗器械合同未约定唯一性标识追溯义务"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定植入类医疗器械的唯一性标识、追溯信息和记录保存义务"
    legal_basis: "《医疗器械监督管理条例》第37条、《医疗器械唯一标识系统规则》"
    suggestion: "明确植入类医疗器械UDI编码记录、追溯信息保存期限（不少于产品使用期限后5年）、信息可追溯性要求"
    enabled: true

  - id: MED012
    category: medical_device
    name: "设备类医疗器械验收条款缺失"
    description: "大型医疗器械合同未约定安装调试、性能验收和临床验证条款"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否约定大型医疗器械的安装调试、性能验收标准和临床验证要求"
    legal_basis: "《医疗器械使用质量监督管理办法》第6条"
    suggestion: "明确约定安装环境要求、调试周期、验收测试项目（含临床验证）、验收不合格的处理方式"
    enabled: true

  - id: MED013
    category: medical_device
    name: "体外诊断试剂批签发证明缺失"
    description: "体外诊断试剂未取得批签发合格证明即供货"
    severity: critical
    check_type: prompt_check
    check_rule: "核查体外诊断试剂是否经批签发合格，供应商是否提供批签发报告"
    legal_basis: "《医疗器械监督管理条例》第13条、《生物制品批签发管理办法》"
    suggestion: "要求供应商提供每批次批签发合格报告，在合同中约定仅接收批签发合格产品"
    enabled: true

  - id: MED014
    category: medical_device
    name: "医疗器械标签说明书不符合规定"
    description: "合同未约定医疗器械标签、说明书应符合法规要求"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定标签说明书内容应符合医疗器械标签说明书管理规定"
    legal_basis: "《医疗器械说明书和标签管理规定》第4条、第6条"
    suggestion: "在合同中明确标签说明书应包含的法定内容、语言文字要求、禁止性内容等"
    enabled: true

  - id: MED015
    category: medical_device
    name: "软件类医疗器械版本管理缺失"
    description: "含软件的医疗器械合同未约定软件版本更新和网络安全责任"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同是否约定含软件版本管理、网络安全事件报告义务"
    legal_basis: "《医疗器械网络安全注册技术审查指导原则》、《医疗器械软件注册技术审查指导原则》"
    suggestion: "明确软件版本号、更新频率、重大版本变更通知义务、网络安全漏洞报告和应急处置要求"
    enabled: true

  - id: MED016
    category: medical_device
    name: "二手医疗器械采购合规性缺失"
    description: "二手医疗器械交易未核实转让方是否具有合法资质"
    severity: high
    check_type: prompt_check
    check_rule: "核查二手医疗器械转让方是否具有医疗器械经营资质，设备是否经检验合格"
    legal_basis: "《医疗器械监督管理条例》第40条、《医疗器械使用质量监督管理办法》第17条"
    suggestion: "核实转让方经营资质，要求提供设备维修记录、性能检验报告，明确二手设备质量保证期限和责任"
    enabled: true

  - id: MED017
    category: medical_device
    name: "临床试验用医疗器械条款混同"
    description: "合同将临床试验用医疗器械与常规采购医疗器械混同约定"
    severity: high
    check_type: prompt_check
    check_rule: "核查合同是否区分临床试验用器械与常规采购器械的管理要求"
    legal_basis: "《医疗器械监督管理条例》第27条、《医疗器械临床试验质量管理规范》"
    suggestion: "临床试验用器械应单独约定管理条款，明确免费提供、知情同意、不良事件报告等特殊要求"
    enabled: true

  - id: MED018
    category: medical_device
    name: "医疗器械广告审查条款缺失"
    description: "合同涉及医疗器械推广时未取得广告审查批准文件"
    severity: medium
    check_type: prompt_check
    check_rule: "核查合同中涉及医疗器械广告推广是否约定广告审查批准文件要求"
    legal_basis: "《医疗器械监督管理条例》第43条、《医疗器械广告审查办法》"
    suggestion: "推广内容应事先取得医疗器械广告审查批准文件，合同应明确广告内容真实合法性责任"
    enabled: true

  # ==================== 临床试验协议 ====================
  - id: MED019
    category: clinical_trial
    name: "伦理审查缺失"
    description: "临床试验方案未经伦理委员会审查批准即签署协议"
    severity: critical
    check_type: prompt_check
    check_rule: "核查临床试验方案是否经牵头单位伦理委员会审查批准，伦理批件是否有效"
    legal_basis: "《医疗器械临床试验质量管理规范》第12条、第14条；《药物临床试验质量管理规范》第12条"
    suggestion: "在签署临床试验协议前取得伦理委员会批件，核实批件批准日期、有效期、批准的研究范围"
    enabled: true

  - id: MED020
    category: clinical_trial
    name: "知情同意条款不完整"
    description: "知情同意书内容不符合法规要求"
    severity: critical
    check_type: prompt_check
    check_rule: "核查知情同意书是否包含法规要求的全部要素"
    legal_basis: "《医疗器械临床试验质量管理规范》第23条、第24条；《药物临床试验质量管理规范》第23条"
    suggestion: "知情同意书应包含研究目的、程序、预期风险与获益、替代治疗、隐私保护、补偿与赔偿、自愿退出权利等法定要素"
    enabled: true

  - id: MED021
    category: clinical_trial
    name: "受试者保险/补偿条款缺失"
    description: "临床试验协议未约定受试者损害的保险保障或补偿方案"
    severity: critical
    check_type: prompt_check
    check_rule: "核查协议是否约定受试者因参与试验发生损害时的保险、补偿或赔偿方案"
    legal_basis: "《医疗器械临床试验质量管理规范》第37条；《药物临床试验质量管理规范》第39条"
    suggestion: "应购买临床试验责任保险或与受试者签订补偿/赔偿协议，明确保险金额、理赔流程、先行赔付机制"
    enabled: true

  - id: MED022
    category: clinical_trial
    name: "临床试验机构资质不符"
    description: "临床试验机构不具备相应资质或备案状态异常"
    severity: critical
    check_type: prompt_check
    check_rule: "核查临床试验机构是否在药监部门备案，是否具备相应专业能力"
    legal_basis: "《医疗器械临床试验质量管理规范》第8条；《药物临床试验机构管理规定》第6条"
    suggestion: "核实临床试验机构在国家药监局临床试验机构备案系统中的备案状态和备案专业范围"
    enabled: true

  - id: MED023
    category: clinical_trial
    name: "主要研究者资质不符"
    description: "主要研究者不具备相应的专业技术职称和执业资格"
    severity: high
    check_type: prompt_check
    check_rule: "核查主要研究者是否具备高级职称、执业资格和相关临床试验经验"
    legal_basis: "《医疗器械临床试验质量管理规范》第11条；《药物临床试验质量管理规范》第11条"
    suggestion: "核实主要研究者的医师执业证书、专业技术职称证书、GCP培训证书，确认其在机构执业"
    enabled: true

  - id: MED024
    category: clinical_trial
    name: "试验用医疗器械管理条款缺失"
    description: "协议未明确试验用医疗器械的运输、接收、使用、回收、销毁管理要求"
    severity: high
    check_type: prompt_check
    check_rule: "核查协议是否约定试验用医疗器械的全生命周期管理要求"
    legal_basis: "《医疗器械临床试验质量管理规范》第42-47条；《药物临床试验质量管理规范》第35-41条"
    suggestion: "明确约定试验用器械的运输条件、接收记录、存储管理、使用记录、剩余器械回收、销毁记录等全流程管理"
    enabled: true

  - id: MED025
    category: clinical_trial
    name: "数据安全监测委员会缺失"
    description: "高风险临床试验未设立数据安全监测委员会（DSMB）"
    severity: high
    check_type: prompt_check
    check_rule: "核查高风险临床试验是否设立数据安全监测委员会，是否明确其职责和工作程序"
    legal_basis: "《医疗器械临床试验质量管理规范》第17条；ICH E6(R2) 5.5"
    suggestion: "对植入类、高风险医疗器械临床试验，应设立DSMB，明确其组成、职责、会议频次和提前终止标准"
    enabled: true

  - id: MED026
    category: clinical_trial
    name: "不良事件/严重不良事件报告条款不明确"
    description: "协议未明确不良事件和严重不良事件的报告时限、方式和内容要求"
    severity: critical
    check_type: prompt_check
    check_rule: "核查协议是否明确SAE报告时限（24小时内）、报告内容和后续随访要求"
    legal_basis: "《医疗器械临床试验质量管理规范》第32条、第33条；《药物临床试验质量管理规范》第26条"
    suggestion: "明确SAE首次报告24小时内、随访报告时限，报告内容应包含受试者信息、事件描述、因果关系判断等"
    enabled: true

  - id: MED027
    category: clinical_trial
    name: "受试者隐私保护条款不足"
    description: "协议未充分约定受试者个人信息和隐私数据的保护措施"
    severity: high
    check_type: prompt_check
    check_rule: "核查协议是否明确受试者数据采集范围、存储安全、使用限制和隐私保护措施"
    legal_basis: "《医疗器械临床试验质量管理规范》第40条；《个人信息保护法》第28条、第29条；《人类遗传资源管理条例》"
    suggestion: "明确数据脱敏要求、存储安全等级、跨境传输限制、人类遗传资源审批要求、数据保留期限"
    enabled: true

  - id: MED028
    category: clinical_trial
    name: "人类遗传资源审批缺失"
    description: "涉及人类遗传资源的临床试验未取得科技部审批"
    severity: critical
    check_type: prompt_check
    check_rule: "核查涉及人类遗传资源采集、保藏、利用、对外提供的临床试验是否取得科技部审批"
    legal_basis: "《人类遗传资源管理条例》第7条、第10条、第11条、第22条"
    suggestion: "涉及人类遗传资源的临床试验，在签署协议前应取得科技部中国人类遗传资源管理办公室审批"
    enabled: true

  - id: MED029
    category: clinical_trial
    name: "临床试验注册条款缺失"
