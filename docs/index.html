<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal SkillHub · 法律 Skill 聚合站</title>
<meta name="description" content="2049 个法律 Agent Skill 的目录、说明书、分类体系与部署入口。">
<link rel="stylesheet" href="./assets/style.css?v=98a9a90">
</head>
<body data-active="home" data-prefix="./">
<div id="header"></div>

<!-- Hero 开机动画 -->
<div class="hero" id="hero">
  <pre class="hero-out"></pre><span class="cursor">▊</span>
</div>

<section class="browse">
  <h1 class="browse-h">Browse Skills</h1>
  <p class="browse-sub">// 2049 个法律 Agent Skill · 目录 · 说明书 · 部署入口</p>

  <!-- 搜索 -->
  <div class="search-box">
    <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="search skills... 合同审查 / contract review / 工伤">
  </div>

  <!-- 排序 -->
  <div class="sort-row" id="sortrow"></div>

  <!-- 维度切换 + 分类 pills -->
  <div class="dim-row" id="dim-tabs"></div>
  <div class="pill-row" id="pills"></div>

  <div class="count-row"><span id="count">加载中…</span></div>
</section>

<!-- Top 精选 -->
<section class="top-zone" id="top-zone" style="display:none"></section>

<!-- 卡片列表 -->
<main class="list-main">
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
</main>

<!-- 底部分类目录 -->
<section class="directory" id="directory"></section>

<div id="footer"></div>
<script src="./assets/common.js?v=98a9a90"></script>
<script src="./assets/app.js?v=98a9a90"></script>
</body>
</html>
